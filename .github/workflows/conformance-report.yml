name: Conformance report

# Manually-triggered pipeline that builds each SDK's conformance adapter and
# runs it through one of two lanes, chosen per SDK by the inputs below:
#
#   v3 lane      tools/run_adapter.py over vectors/v3 for every SDK, then
#                tools/compare_adapters.py against the first SDK listed (the
#                reference) and tools/v3_report.py for the job summary. Any
#                failing fixture or cross-SDK divergence fails the job.
#   legacy lane  the ./harness runner over the manifest.yaml fixtures (the v2
#                stages: sigstore, attestation-*, verify-full, ...) plus
#                gen_report.py's homogenization report (HTML heatmap +
#                markdown + CSV).
#
# An adapter that only speaks the v3-* stages (capabilities nested under
# `v3`) skips every legacy fixture, so put each SDK in the lane its adapter
# implements. Summaries from both lanes land in the run summary and all
# reports are uploaded as artifacts.
#
# Cross-repo checkout: if the SDK repos are private, add a repo secret
# SDK_TOKEN (a PAT / fine-grained token with read access to the tinfoil-* SDK
# repos). For public repos the default GITHUB_TOKEN is sufficient.

on:
  workflow_dispatch:
    inputs:
      v3_sdks:
        description: "SDKs on the v3 lane (comma-separated: go,py,rs,js; first = reference)"
        default: "go,js"
        type: string
      legacy_sdks:
        description: "SDKs on the legacy harness lane (comma-separated: go,py,rs,js)"
        default: "py,rs"
        type: string
      go_ref:
        description: "tinfoil-go ref"
        # main is the v3 reference adapter.
        default: "main"
        type: string
      python_ref:
        description: "tinfoil-python ref"
        # Legacy adapter. The v3 adapter (conformance/tinfoil_conformance.py)
        # is picked up automatically from any ref that carries it.
        default: "feat/tinfoil-conformance"
        type: string
      rust_ref:
        description: "tinfoil-rs ref"
        # Legacy adapter.
        default: "feat/tinfoil-conformance"
        type: string
      js_ref:
        description: "tinfoil-js ref"
        # The v3 port lives on this branch until it merges; then this moves to main.
        default: "milesdai/feat/v3-generation"
        type: string

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      V3_LANE: ${{ inputs.v3_sdks }}
      LEGACY_LANE: ${{ inputs.legacy_sdks }}
      # Comma-wrapped union of both lanes so we can match whole tokens.
      SELECTED: ",${{ inputs.v3_sdks }},${{ inputs.legacy_sdks }},"
    steps:
      - name: Check out conformance suite
        uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Rust (cargo) is preinstalled on ubuntu-latest runners.

      # --- Check out the SDK repos (best-effort; a failure is tolerated so the
      #     report still runs for whatever SDKs are available) ---
      - name: Check out tinfoil-go
        if: contains(env.SELECTED, ',go,')
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: tinfoilsh/tinfoil-go
          ref: ${{ inputs.go_ref }}
          path: sdks/tinfoil-go
          token: ${{ secrets.SDK_TOKEN || github.token }}

      - name: Check out tinfoil-python
        if: contains(env.SELECTED, ',py,')
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: tinfoilsh/tinfoil-python
          ref: ${{ inputs.python_ref }}
          path: sdks/tinfoil-python
          token: ${{ secrets.SDK_TOKEN || github.token }}

      - name: Check out tinfoil-rs
        if: contains(env.SELECTED, ',rs,')
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: tinfoilsh/tinfoil-rs
          ref: ${{ inputs.rust_ref }}
          path: sdks/tinfoil-rs
          token: ${{ secrets.SDK_TOKEN || github.token }}

      - name: Check out tinfoil-js
        if: contains(env.SELECTED, ',js,')
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: tinfoilsh/tinfoil-js
          ref: ${{ inputs.js_ref }}
          path: sdks/tinfoil-js
          token: ${{ secrets.SDK_TOKEN || github.token }}

      # --- Build each SDK's conformance adapter (best-effort) ---
      - name: Build tinfoil-go
        if: contains(env.SELECTED, ',go,') && hashFiles('sdks/tinfoil-go/go.mod') != ''
        continue-on-error: true
        working-directory: sdks/tinfoil-go
        run: go build -tags tinfoil_conformance -o bin/tinfoil-conformance ./cmd/tinfoil-conformance/

      - name: Build tinfoil-python
        if: contains(env.SELECTED, ',py,') && hashFiles('sdks/tinfoil-python/pyproject.toml') != ''
        continue-on-error: true
        run: |
          python -m venv sdks/tinfoil-python/.venv
          sdks/tinfoil-python/.venv/bin/pip install --quiet -e sdks/tinfoil-python

      - name: Build tinfoil-rs
        if: contains(env.SELECTED, ',rs,') && hashFiles('sdks/tinfoil-rs/Cargo.toml') != ''
        continue-on-error: true
        working-directory: sdks/tinfoil-rs
        run: cargo build --release --bin tinfoil-conformance

      - name: Build tinfoil-js
        if: contains(env.SELECTED, ',js,') && hashFiles('sdks/tinfoil-js/package.json') != ''
        continue-on-error: true
        working-directory: sdks/tinfoil-js
        run: |
          npm ci
          npm run build -w @tinfoilsh/verifier
          npm run build:conformance -w @tinfoilsh/verifier

      # --- Resolve one adapter command per SDK from whatever built. Both lanes
      #     read these; an SDK whose build failed resolves to nothing. ---
      - name: Resolve adapter commands
        run: |
          set -euo pipefail
          go_bin="$PWD/sdks/tinfoil-go/bin/tinfoil-conformance"
          py_bin="$PWD/sdks/tinfoil-python/.venv/bin/tinfoil-conformance"
          py_v3="$PWD/sdks/tinfoil-python/conformance/tinfoil_conformance.py"
          rs_bin="$PWD/sdks/tinfoil-rs/target/release/tinfoil-conformance"
          js_cli="$PWD/sdks/tinfoil-js/packages/verifier/dist-conformance/conformance/cli.js"
          [ -x "$go_bin" ] && echo "ADAPTER_go=$go_bin" >> "$GITHUB_ENV"
          if [ -x "$py_bin" ]; then
            echo "ADAPTER_py=$py_bin" >> "$GITHUB_ENV"
          elif [ -f "$py_v3" ]; then
            echo "ADAPTER_py=$PWD/sdks/tinfoil-python/.venv/bin/python $py_v3" >> "$GITHUB_ENV"
          fi
          [ -x "$rs_bin" ] && echo "ADAPTER_rs=$rs_bin" >> "$GITHUB_ENV"
          [ -f "$js_cli" ] && echo "ADAPTER_js=node $js_cli" >> "$GITHUB_ENV"
          true

      # ===================== v3 lane =====================
      - name: "v3 lane: run adapters over vectors/v3"
        if: env.V3_LANE != ''
        run: |
          set -uo pipefail
          mkdir -p results/v3
          ran=(); failed=()
          IFS=, read -ra lane <<< "$V3_LANE"
          for sdk in "${lane[@]}"; do
            var="ADAPTER_$sdk"; cmd="${!var:-}"
            if [ -z "$cmd" ]; then
              echo "::warning::tinfoil-$sdk: no adapter built; skipping the v3 lane for it"
              continue
            fi
            echo "::group::tinfoil-$sdk ($cmd)"
            ran+=("$sdk")
            python3 tools/run_adapter.py --adapter "$cmd" --report "results/v3/tinfoil-$sdk.json" \
              || failed+=("$sdk")
            echo "::endgroup::"
          done
          if [ ${#ran[@]} -eq 0 ]; then
            echo "::error::No v3 adapters were built for [$V3_LANE] — check the SDK checkout/build steps (private repos need the SDK_TOKEN secret)."
            exit 1
          fi
          echo "V3_RAN=${ran[*]}" >> "$GITHUB_ENV"
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::v3 fixtures failed for: ${failed[*]}"
            exit 1
          fi

      # The reference is the first SDK in v3_sdks that produced a report.
      - name: "v3 lane: compare adapters against the reference"
        if: always() && env.V3_RAN != ''
        run: |
          set -euo pipefail
          reports=()
          for sdk in $V3_RAN; do reports+=("results/v3/tinfoil-$sdk.json"); done
          if [ ${#reports[@]} -lt 2 ]; then
            echo "Only ${reports[*]} ran the v3 lane; nothing to compare."
            exit 0
          fi
          python3 tools/compare_adapters.py "${reports[@]}"

      - name: "v3 lane: render summary"
        if: always() && env.V3_RAN != ''
        run: |
          set -euo pipefail
          reports=()
          for sdk in $V3_RAN; do reports+=("results/v3/tinfoil-$sdk.json"); done
          python3 tools/v3_report.py --out results/v3/report.md "${reports[@]}"
          cat results/v3/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: "v3 lane: upload reports"
        if: always() && env.V3_RAN != ''
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report-v3
          path: results/v3/
          if-no-files-found: warn

      # ===================== legacy lane =====================
      - name: "legacy lane: install harness"
        if: always() && env.LEGACY_LANE != ''
        run: |
          python -m venv .harness-venv
          .harness-venv/bin/pip install --quiet ./harness pyyaml

      - name: "legacy lane: run suite + generate report"
        if: always() && env.LEGACY_LANE != ''
        run: |
          set -euo pipefail
          args=()
          IFS=, read -ra lane <<< "$LEGACY_LANE"
          for sdk in "${lane[@]}"; do
            var="ADAPTER_$sdk"; cmd="${!var:-}"
            if [ -z "$cmd" ]; then
              echo "::warning::tinfoil-$sdk: no adapter built; skipping the legacy lane for it"
              continue
            fi
            args+=(--sdk "tinfoil-$sdk=$cmd")
          done
          if [ ${#args[@]} -eq 0 ]; then
            echo "::error::No legacy adapters were built for [$LEGACY_LANE] — check the SDK checkout/build steps (private repos need the SDK_TOKEN secret)."
            exit 1
          fi
          echo "Registered SDKs: ${args[*]}"
          .harness-venv/bin/tinfoil-conformance run "${args[@]}" \
            --vectors vectors/ --tdx-public-api-variants
          .harness-venv/bin/python gen_report.py \
            --results results/latest/results.json \
            --vectors vectors/ \
            --out results/latest/report

      - name: "legacy lane: render report into job summary"
        if: always() && hashFiles('results/latest/report/report.md') != ''
        run: cat results/latest/report/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: "legacy lane: upload report artifacts"
        if: always() && hashFiles('results/latest/report/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: results/latest/report/
          if-no-files-found: warn
