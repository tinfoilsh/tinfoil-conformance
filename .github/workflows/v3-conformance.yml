name: v3 conformance gate

# Fast gate for the v3 suite: (1) validate every fixture against the published
# JSON Schemas, assert the coverage matrix is fully accounted-for, and check
# that the generators reproduce every fixture byte for byte (pure Python, no SDK
# needed); (2) run the shared v3 fixtures through the tinfoil-go
# reference harness (the tinfoil_conformance-tagged adapter).

on:
  push:
    branches: [main, feat/v3-conformance]
    paths: ["vectors/v3/**", "schemas/v3/**", "fixturegen/v3/**", "fixturegen/lib/**", "docs/SPEC_COVERAGE_V3.md", "tools/validate_suite.py"]
  pull_request:
    paths: ["vectors/v3/**", "schemas/v3/**", "fixturegen/v3/**", "fixturegen/lib/**", "docs/SPEC_COVERAGE_V3.md", "tools/validate_suite.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Fixtures + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate fixtures against schemas + assert coverage matrix
        run: python3 tools/validate_suite.py
      - name: Regenerate the v3 fixtures and require no diff
        run: |
          set -euo pipefail
          pip install --quiet cryptography==50.0.2
          for g in fixturegen/v3/gen_*.py; do python3 "$g"; done
          git status --porcelain -- vectors/v3
          test -z "$(git status --porcelain -- vectors/v3)"

  harness:
    name: go reference harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Check out the tinfoil-go v3 harness
        uses: actions/checkout@v4
        with:
          repository: tinfoilsh/tinfoil-go
          ref: 66e16b2904e54313e6f1060f8b6ba7344ff777b1
          path: sdks/tinfoil-go
          token: ${{ secrets.SDK_TOKEN || github.token }}
      - name: Run the shared v3 fixtures through the harness
        working-directory: sdks/tinfoil-go
        run: |
          set -euo pipefail
          for d in "$GITHUB_WORKSPACE"/vectors/v3/*/; do
            echo "== $(basename "$d")"
            TINFOIL_CONFORMANCE_FIXTURES="$d" \
              go test -count=1 -tags tinfoil_conformance -run TestFixtures ./verify/conformance/
          done
      - name: Verify a live enclave against the embedded production roots
        working-directory: sdks/tinfoil-go
        env:
          TINFOIL_LIVE_HOST: inference.tinfoil.sh
          TINFOIL_LIVE_REPO: tinfoilsh/confidential-model-router
        run: go test -count=1 -v -tags tinfoil_conformance -run TestLiveVerification ./verify/conformance/
