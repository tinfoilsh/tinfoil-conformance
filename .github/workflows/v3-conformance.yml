name: v3 conformance gate

# Fast gate for the v3 suite: (1) validate every fixture against the published
# JSON Schemas and assert the coverage matrix is fully accounted-for (pure
# Python, no SDK needed); (2) run the shared v3 fixtures through the tinfoil-go
# reference harness (the tinfoil_conformance-tagged adapter).

on:
  push:
    branches: [main, feat/v3-conformance]
    paths:
      - "vectors/v3/**"
      - "schemas/v3/**"
      - "fixturegen/v3/**"
      - "docs/SPEC_COVERAGE_V3.md"
      - "tools/validate_suite.py"
      - "harness/**"
      - "vectors/verify-full/**"
      - "vectors/attestation-sev/**"
      - "vectors/sigstore/**"
      - "schemas/verify-full.*.schema.json"
      - "fixturegen/verify_full_phase1_fixtures.py"
      - ".github/workflows/v3-conformance.yml"
  pull_request:
    paths:
      - "vectors/v3/**"
      - "schemas/v3/**"
      - "fixturegen/v3/**"
      - "docs/SPEC_COVERAGE_V3.md"
      - "tools/validate_suite.py"
      - "harness/**"
      - "vectors/verify-full/**"
      - "vectors/attestation-sev/**"
      - "vectors/sigstore/**"
      - "schemas/verify-full.*.schema.json"
      - "fixturegen/verify_full_phase1_fixtures.py"
      - ".github/workflows/v3-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Fixtures + coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install harness dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e ./harness
      - name: Validate fixtures against schemas + assert coverage matrix
        run: .venv/bin/python tools/validate_suite.py
      - name: Test runner and legacy pinned-fixture contracts
        run: .venv/bin/python -m unittest discover -s harness/tests -v

  harness:
    name: go reference harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Check out the tinfoil-go v3 harness
        uses: actions/checkout@v4
        with:
          repository: tinfoilsh/tinfoil-go
          ref: feat/v3-conformance-harness
          path: sdks/tinfoil-go
          token: ${{ secrets.SDK_TOKEN || github.token }}
      - name: Run the shared v3 fixtures through the harness
        working-directory: sdks/tinfoil-go
        run: |
          set -euo pipefail
          for d in "$GITHUB_WORKSPACE"/vectors/v3/*/; do
            echo "== $(basename "$d")"
            TINFOIL_CONFORMANCE_FIXTURES="$d" \
              go test -count=1 -tags tinfoil_conformance -run TestFixtures ./verifier/conformance/
          done
      - name: Verify a live enclave against the embedded production roots
        working-directory: sdks/tinfoil-go
        env:
          TINFOIL_LIVE_HOST: inference.tinfoil.sh
          TINFOIL_LIVE_REPO: tinfoilsh/confidential-model-router
        run: go test -count=1 -v -tags tinfoil_conformance -run TestLiveVerification ./verifier/conformance/
