id: 720-attestation-hash-mismatch
stage: verify-enclave-cert
title: |
  Cert attestation-hash SAN not equal to the document hash must reject (SPEC §9.4).
spec_refs: ["9.1", "9.2", "9.3", "9.4"]
expects:
  exit_code: 10
  rejection_code: "ENCLAVE_CERT_HASH_MISMATCH"
required_capabilities:
  enclave_cert.offline_verification_supported: true
fixture_kind: synthetic
notes: |
  The attestation_document body is altered so its computed SHA-256(format+body)
  no longer equals the hash dcode-encoded in the cert's `.hatt.` SANs. Must
  reject — the cert is bound to a different document.
