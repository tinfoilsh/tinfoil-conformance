notes: |
  End-to-end standard flow on TDX. The Sigstore bundle is a synthetic
  re-sign of fixture 001's payload with its predicate tdx_measurement
  rtmr1/rtmr2 set to the real TDX quote (fixture 300)'s values, so the
  MultiPlatform measurement matches the fully-verified quote (§7.3.2) and
  verify-full accepts. Exercises the verify-full TDX path end-to-end
  (previously an unwired stub). Gated on attestation_tdx.verify_full_supported
  so rs (no native TDX verifier) and js (TDX only in the js-tdx variant) skip.
