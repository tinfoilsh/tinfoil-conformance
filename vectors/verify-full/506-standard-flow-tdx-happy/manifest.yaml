title: |
  Standard flow (TDX) happy path: sigstore MultiPlatform measurement matches the verified TDX quote (SPEC §11.1 / §7.3.2).
spec_refs: ["11.1", "7.3.2", "4"]
expects:
  exit_code: 0
required_capabilities:
  attestation_tdx.verify_full_supported: true
  sigstore.trust_root_loading: "configurable"
