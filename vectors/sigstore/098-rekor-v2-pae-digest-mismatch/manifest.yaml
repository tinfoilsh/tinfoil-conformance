id: 098-rekor-v2-pae-digest-mismatch
stage: verify-sigstore
title: |
  Rekor v2 hashedrekord whose logged digest is not SHA-256(PAE) of the bundle envelope must reject.
spec_refs: ["5.2"]
expects:
  exit_code: 10
  rejection_code: ["REKOR_INCLUSION_INVALID"]
required_capabilities:
  sigstore.trust_root_loading: "configurable"
  sigstore.verification_time_override: ["supported", "bundle-supplied-only"]
  sigstore.policy_fields_configurable.workflow_ref_prefix: true
  sigstore.policy_fields_configurable.predicate_types_allowed: true
  sigstore.rekor_v2_supported: true
fixture_kind: synthetic
notes: |
  The log entry is internally valid (checkpoint signed over this body) but
  records a different digest, i.e. a different envelope was logged.
  Verifiers must bind data.digest to the bundle's PAE (rekor-v2-spec §6.1.4).
