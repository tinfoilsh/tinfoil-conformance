id: 096-rekor-v2-tsa-untrusted
stage: verify-sigstore
title: |
  Rekor v2 entry whose RFC 3161 timestamp comes from a TSA not in the trust root must reject.
spec_refs: ["5.2"]
expects:
  exit_code: 10
  rejection_code: ["OBSERVER_TIMESTAMP_INSUFFICIENT"]
required_capabilities:
  sigstore.trust_root_loading: "configurable"
  sigstore.verification_time_override: ["supported", "bundle-supplied-only"]
  sigstore.policy_fields_configurable.workflow_ref_prefix: true
  sigstore.policy_fields_configurable.predicate_types_allowed: true
  sigstore.rekor_v2_supported: true
fixture_kind: synthetic
notes: |
  The trust root's timestampAuthorities is swapped for an unrelated synthetic TSA,
  so the token's signer is unknown and no observer timestamp remains.
