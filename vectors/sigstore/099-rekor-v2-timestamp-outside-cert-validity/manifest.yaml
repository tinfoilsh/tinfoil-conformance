id: 099-rekor-v2-timestamp-outside-cert-validity
stage: verify-sigstore
title: |
  Rekor v2 entry whose RFC 3161 timestamp falls outside the signing certificate's validity must reject.
spec_refs: ["5.2"]
expects:
  exit_code: 10
  rejection_code: ["CERT_EXPIRED", "OBSERVER_TIMESTAMP_INSUFFICIENT", "FULCIO_CHAIN_INVALID"]
required_capabilities:
  sigstore.trust_root_loading: "configurable"
  sigstore.verification_time_override: ["supported", "bundle-supplied-only"]
  sigstore.policy_fields_configurable.workflow_ref_prefix: true
  sigstore.policy_fields_configurable.predicate_types_allowed: true
  sigstore.rekor_v2_supported: true
fixture_kind: synthetic
notes: |
  The leaf certificate is valid for ten minutes a day before the token's genTime.
  The timestamp verifies but does not place the signature inside the cert window.
  sigstore-go reports this as a generic leaf-certificate failure (FULCIO_CHAIN_INVALID).
